apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9090

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-remote-write-receiver

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: rules
              mountPath: /etc/prometheus/rules

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: rules
          configMap:
            name: prometheus-rules
