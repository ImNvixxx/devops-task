apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring

data:
  fastapi-alert-rules.yaml: |
    groups:
    - name: fastapi-alerts
      rules:
      - alert: FastAPIInstanceDown
        expr: up{job="fastapi"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "FastAPI application is down"
          description: "FastAPI instance {{ $labels.instance }} is unreachable"
